connections:
  - name: "Line1-PLC"
    protocol: "tcp"
    host: "localhost"
    port: 5020
    unit_id: 1
    timeout_s: 2.0
    scan_rate_ms: 500
    reconnect_delay_s: 1.0
    tags:
      - tag_path: "[Modbus]Line1/Motor1/Speed"
        register_type: "holding"
        address: 100
        data_type: "uint16"
        description: "Motor speed"
        engineering_units: "rpm"
      - tag_path: "[Modbus]Line1/Tank1/Temperature"
        register_type: "holding"
        address: 101
        data_type: "float32"
        byte_order: "big"
        word_order: "big"
        description: "Tank temperature"
        engineering_units: "degC"
      - tag_path: "[Modbus]Line1/Pump1/Running"
        register_type: "coil"
        address: 0
        data_type: "bool"
        description: "Pump running"
      - tag_path: "[Modbus]Line1/Tank1/Pressure"
        register_type: "input"
        address: 200
        data_type: "uint16"
        description: "Tank pressure"
        engineering_units: "kPa"
