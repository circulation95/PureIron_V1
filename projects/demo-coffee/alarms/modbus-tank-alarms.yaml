alarms:
  # ─── Tank1 ────────────────────────────────────────────────────────────────
  - name: "Tank1-Level-High"
    tag_path: "[modbus_test]CoffeeTank/Tank1/level"
    alarm_type: AboveSetpoint
    setpoint: 85
    deadband: 2
    on_delay_s: 1
    priority: High
    description: "Tank1 level high"

  - name: "Tank1-Level-Low"
    tag_path: "[modbus_test]CoffeeTank/Tank1/level"
