connections:
  - name: "Line-A PLC"
    protocol: tcp
    host: 10.0.0.5
    port: 502
    unit_id: 3
    timeout_s: 1.5
    scan_rate_ms: 250
    password: "fixture-secret-value"
    tags:
      - tag_path: "[Modbus]LineA/temp"
        register_type: holding
        address: 10
        data_type: float32
        word_order: little
        description: "A라인 온도"
        engineering_units: "°C"
      - tag_path: "[Modbus]LineA/run"
        register_type: discrete_input
        address: 3
        data_type: bool
  - name: "Serial PLC"
    protocol: rtu
    serial_port: COM3
    tags:
      - tag_path: "[Modbus]Serial/level"
        register_type: holding
        address: 0
