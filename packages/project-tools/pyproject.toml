[project]
name = "pureiron-project-tools"
version = "0.1.0"
description = "고객 프로젝트 정규화·검증·content hash 도구"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ruamel.yaml>=0.18.15",
    "jsonschema>=4.25",
    "rfc8785>=0.1.4",
    # absorb·gate: 현장 드래프트 서명 검증·tarsafe·드래프트 게이트를 복사하지 않고 재사용(M5-3 K7).
    "pureiron-bundle-tools",
]

[tool.uv.sources]
pureiron-bundle-tools = { workspace = true }

[project.scripts]
pureiron-project = "pureiron_project.cli:main"

[build-system]
requires = ["uv_build==0.10.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pureiron_project"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# generated ≠ authored (ADR-028, PD-20): 생성물(.py·.pyi)의 진단은 끄고, 타입은 .pyi(mypy-protobuf)를
# 정본으로 authored 코드에서 strict 소비한다. 생성 .pyi 자체의 진단은 생성기·types-protobuf 버전 조합 문제라 제외.
ignore = ["src/pureiron_project/_gen/**"]
