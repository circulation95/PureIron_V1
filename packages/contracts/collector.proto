// collector ↔ core 계약(ADR-020). 정본이며 호환성은 `buf breaking`(contracts-diff)으로 지킨다.
// 생성물: services/{core,collector}/src/<pkg>/_gen/ (packages/contracts/tools/gen_proto.py).
syntax = "proto3";

package pureiron.collector.v1;

// core = 서버(:50051), collector = 클라이언트. 양방향 스트림 하나로 plan·값·Ack가 오간다.
service Acquisition {
  rpc Session(stream CollectorMsg) returns (stream CoreMsg);
}

message CoreMsg {
  oneof msg {
    AcquisitionPlan plan = 1;
    WriteRequest write = 2;
    Ack ack = 3;
  }
}

message CollectorMsg {
  oneof msg {
    Hello hello = 1;
    ValueBatch batch = 2;
    DeviceHealth health = 3;
    WriteResult write_result = 4;
  }
}

message Hello {
  string collector_version = 1;
  uint64 last_plan_rev = 2;
  uint64 oldest_unacked_seq = 3;
}

message AcquisitionPlan {
  uint64 plan_rev = 1;
  repeated Device devices = 2;
  repeated TagPoint tags = 3;
  uint32 default_poll_ms = 4;
}

message Device {
  string device_id = 1;
  string protocol = 2;
  string host = 3;
  uint32 port = 4;
  uint32 unit_id = 5;
  uint32 poll_ms = 6;
  uint32 timeout_ms = 7;
}

// 프로토콜 추가 = address oneof 확장(호환).
message TagPoint {
  uint32 tag_id = 1;
  string device_id = 2;
  oneof address {
    ModbusAddress modbus = 3;
  }
  // core가 이 태그에 쓰기를 보낼 수 있다(project 쓰기 선언 + 현장 스위치 켜짐). false면 collector는
  // 이 태그의 WriteRequest를 REJECTED로 답한다(2중 방어). 기본값 false = 읽기 전용.
  bool writable = 5;
}

message ModbusAddress {
  string register_type = 1;
  uint32 address = 2;
  string data_type = 3;
  string byte_order = 4;
  string word_order = 5;
}

// replay=true(재연결 후 재전송분)는 core가 historian에만 기록한다.
message ValueBatch {
  uint64 plan_rev = 1;
  uint64 seq = 2;
  bool replay = 3;
  repeated Sample samples = 4;
}

message Sample {
  uint32 tag_id = 1;
  int64 ts_unix_ns = 2;
  oneof v {
    double num = 3;
    bool flag = 4;
  }
  Quality quality = 5;
}

enum Quality {
  QUALITY_UNSPECIFIED = 0;
  GOOD = 1;
  BAD = 2;
  UNCERTAIN = 3;
}

// legacy drivers/health.py:113-135 매핑. optional 필드 미설정 = 데이터 없음.
message DeviceHealth {
  string device_name = 1;
  string protocol = 2;
  string status = 3;
  bool connected = 4;
  optional int64 last_success_unix_ns = 5;
  optional string last_error = 6;
  optional int64 last_error_at_unix_ns = 7;
  uint32 consecutive_failures = 8;
  optional double poll_latency_ms = 9;
  uint32 tag_count = 10;
  optional double read_success_rate = 11;
  uint64 poll_total = 12;
  uint64 timeout_count = 13;
  uint32 bad_quality_tag_count = 14;
  uint64 reconnect_count = 15;
}

// core in-memory ingest 직후 송신. collector 링버퍼 해제 기준.
message Ack {
  uint64 seq = 1;
}

// 쓰기는 core만 보낸다(ADR-013 개정: 선언된 태그·현장별 활성화·사람 확인 또는 승인된 예약·readback·감사).
// PLC 로직은 바꾸지 않는다 — collector는 값 쓰기 함수(coil FC5, 1워드 FC6, 2·4워드 FC16)만 쓰고
// 자동 재시도하지 않는다. bool·coil 값은 value 0/1로 보낸다.
message WriteRequest {
  string request_id = 1;
  uint32 tag_id = 2;
  double value = 3;
  // core가 쓰기를 판단한 plan. 0이거나 collector가 적용 중인 plan_rev와 다르면 REJECTED.
  uint64 plan_rev = 4;
  // collector가 받은 순간부터 이 시간(ms, 상대) 안에 장비로 보내기 시작하지 못하면 보내지 않고 REJECTED.
  // 0이면 REJECTED. core가 이 시간 + 장비 timeout_ms×2(쓰기·재읽기) + 여유보다 길게 기다리면,
  // core가 응답 없음으로 확정한 뒤 그 쓰기가 PLC에 닿는 일은 없다.
  uint32 timeout_ms = 5;
}

// 단계별 결과: 보내기 전 = REJECTED, 확실히 안 써짐 = FAILED, 보낸 뒤 모름 = INDETERMINATE,
// 장비 정상 응답 = OK(재읽기 실패는 OK 그대로 + readback 비움 + error).
message WriteResult {
  string request_id = 1;
  // 0(기본값)이 REJECTED — 값이 빠진 응답은 거부로 읽힌다(fail-safe).
  enum Status {
    // collector가 보내지 않았다(plan_rev·timeout 누락, 모르는 태그, writable=false, 인코딩 불가,
    // 기한 경과, 큐 가득·같은 태그 진행 중·request_id 중복, poller 정지).
    REJECTED = 0;
    // 장비가 쓰기에 정상 응답했다. 반영 여부 판정은 core가 readback으로 한다.
    OK = 1;
    // 확실히 안 써졌다: 장비 미연결(보내지 않음) 또는 Modbus 예외 응답.
    FAILED = 2;
    // 보낸 뒤 결과를 모른다: 응답 시간 초과·연결 끊김·보내는 도중 취소. 성공으로 읽지 않는다.
    INDETERMINATE = 3;
  }
  Status status = 2;
  string error = 3;
  // OK 직후 같은 주소를 다시 읽은 값(decode 결과, bool은 0/1). 재읽기에 실패하면 비어 있고 error에 이유.
  optional double readback = 4;
  optional int64 readback_ts_unix_ns = 5;
}
