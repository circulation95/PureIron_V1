# 현장 compose(ADR-019, PD-19). 프로젝트 이름은 항상 pureiron.
# - 이미지는 서명 번들에서 로드된 pureiron/<svc>:<release>만 쓴다(pull_policy: never, registry pull 금지).
# - site-db는 업스트림을 pureiron/site-db:<ver>로 retag한 이미지(deploy/releases/site-db.lock).
# - 비밀값은 파일로만: ${PUREIRON_SECRETS_DIR}/{db_password,updater_token} (PD-4).
# - simulator는 dev profile 전용.
name: pureiron

services:
  site-db:
    image: pureiron/site-db:${PUREIRON_SITE_DB_VERSION:-2.30.2-pg16}
    pull_policy: never
    # TimescaleDB 텔레메트리(기본 basic)는 telemetry.timescale.com으로 접속을 시도한다(M2d VM 실측:
    # 폐쇄망 현장의 외부 DNS 질의). 이미지는 db-step release로만 바꾸므로 기동 인자로 끈다.
    command: ["postgres", "-c", "timescaledb.telemetry_level=off"]
    environment:
      POSTGRES_USER: pureiron
      POSTGRES_DB: pureiron
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - ${PUREIRON_DB_DATA:-/var/lib/pureiron/db}:/var/lib/postgresql/data
    healthcheck:
      # TCP(-h 127.0.0.1)로 본다 — 첫 기동의 initdb 임시 서버는 unix socket만 열어 socket 검사는
      # 통과하지만 곧 재시작한다(그 사이 다른 컨테이너의 TCP 접속은 거부된다).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pureiron -d pureiron"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  core:
    image: pureiron/core:${PUREIRON_RELEASE:-0.1.0-dev}
    pull_policy: never
    depends_on:
      site-db:
        condition: service_healthy
    environment:
      PUREIRON_DB_DSN: postgresql://pureiron@site-db:5432/pureiron
      PUREIRON_DB_PASSWORD_FILE: /run/secrets/db_password
      PUREIRON_UPDATER_TOKEN_FILE: /run/secrets/updater_token
      PUREIRON_RELEASE: ${PUREIRON_RELEASE:-0.1.0-dev}
    secrets: [db_password, updater_token]
    # SIGTERM 뒤 SIGKILL까지(기본 10s). half-open DB에서 종료 최악 = HTTP 유예 2s + gRPC 2s +
    # historian 15s ≈ 19.1s라 최종 이력 flush가 끝나도록 20s(cli.py HTTP_GRACEFUL_SHUTDOWN_S, W5).
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  collector:
    image: pureiron/collector:${PUREIRON_RELEASE:-0.1.0-dev}
    pull_policy: never
    depends_on:
      core:
        condition: service_healthy
    environment:
      PUREIRON_CORE_GRPC: core:50051
    restart: unless-stopped

  web:
    image: pureiron/web:${PUREIRON_RELEASE:-0.1.0-dev}
    pull_policy: never
    depends_on:
      core:
        condition: service_healthy
    ports:
      - ${PUREIRON_WEB_BIND:-0.0.0.0}:${PUREIRON_WEB_PORT:-80}:8080
    restart: unless-stopped

  simulator:
    image: pureiron/simulator:${PUREIRON_RELEASE:-0.1.0-dev}
    pull_policy: never
    profiles: [dev]
    restart: unless-stopped

secrets:
  db_password:
    file: ${PUREIRON_SECRETS_DIR:-/var/lib/pureiron/state/secrets}/db_password
  updater_token:
    file: ${PUREIRON_SECRETS_DIR:-/var/lib/pureiron/state/secrets}/updater_token

volumes:
  # 개발·CI에서 PUREIRON_DB_DATA=pureiron-db 로 쓰는 named volume(현장은 /var/lib/pureiron/db bind).
  pureiron-db: {}
