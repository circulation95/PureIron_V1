# fleet PR 검사: PureIron_V1의 reusable workflow가 변경 현장 파일의 계약·파일명·.retired(E_FLEET)와
# generation 규칙(E_GEN)을 control-api(viewer 토큰)로 확인한다.
name: check-gen

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-gen:
    # @ref = 도구 버전 = PureIron_V1 릴리스 태그(r5~). publish.yml과 같은 ref를 쓴다(README "도구 버전").
    uses: circulation95/PureIron_V1/.github/workflows/fleet-check-gen.yml@r5
    with:
      runs_on: '["self-hosted", "publish"]'
      # control-api 기준 URL(publish 호스트에서 닿는 주소). 없으면 http://127.0.0.1:8100/api/v1.
      # 중앙 compose(Caddy HTTPS, 사설 CA)면 publish.yml과 같은 값으로(README "control-api 주소").
      # control_api: https://<중앙 주소>:28443/api/v1
    secrets:
      PUREIRON_CI_APP_ID: ${{ secrets.PUREIRON_CI_APP_ID }}
      PUREIRON_CI_APP_KEY: ${{ secrets.PUREIRON_CI_APP_KEY }}
      PUREIRON_FLEET_VIEWER_TOKEN: ${{ secrets.PUREIRON_FLEET_VIEWER_TOKEN }}
