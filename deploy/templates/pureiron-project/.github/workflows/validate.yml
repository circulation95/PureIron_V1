# 고객 프로젝트 검증: PureIron_V1의 reusable workflow가 validate → fmt --check → hash를 돌리고
# content_hash·project_version(태그 vN일 때)을 출력한다.
name: validate

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    # 운영 repo는 @master 대신 PureIron_V1 릴리스 태그로 고정한다(검증 도구 버전이 함께 고정된다).
    uses: circulation95/PureIron_V1/.github/workflows/validate-project.yml@master
    secrets:
      PUREIRON_CI_APP_ID: ${{ secrets.PUREIRON_CI_APP_ID }}
      PUREIRON_CI_APP_KEY: ${{ secrets.PUREIRON_CI_APP_KEY }}
