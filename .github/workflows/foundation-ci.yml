# G1 게이트(ADR-028, plan §5 M1). PoC 무료 모드(PD-23): self-hosted runner `g1`(개발 PC WSL2 Ubuntu)에서만 돈다.
# 각 job은 scripts/g1.sh의 같은 이름 job을 호출한다 — 로컬과 CI가 같은 명령을 쓴다.
name: foundation-ci

on:
  pull_request:
    # labeled: `full-gate` 라벨을 붙이면 조건부 job까지 다시 돈다.
    types: [opened, synchronize, reopened, labeled]
    paths: &gate-paths
      - services/**
      - packages/**
      - deploy/**
      - tests/e2e/**
      - pyproject.toml
      - uv.lock
      - scripts/g1.sh
      - scripts/tools.sh
      - .dockerignore
      - .github/workflows/foundation-*.yml
      - .github/workflows/validate-project.yml
  push:
    branches: [master]
    paths: *gate-paths
  # 밤 전체 실행(조건부 job n-minus-1·repro-build 포함)은 GitHub schedule이 아니라 개발 PC의 Windows
  # 작업 스케줄러가 01:47 KST에 `gh workflow run foundation-ci.yml --ref master`로 연다
  # (tests/e2e/infra/register-nightly.ps1, M6-4a P9) — GitHub cron은 이 저장소에서 3.5~7.5시간 늦게
  # 만들어져 03:17 G2 nightly와 겹쳤다. plan job은 pull_request가 아닌 이벤트(workflow_dispatch 포함)를
  # 모두 전체 실행으로 본다.
  workflow_dispatch:

concurrency:
  # PR은 새 커밋이 오면 이전 실행을 취소한다. master push·밤 실행(workflow_dispatch)은 서로 취소하지 않는다.
  group: foundation-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  UV_VERSION: "0.10.12"
  NODE_VERSION: "22"
  # contracts-diff·migration-lint 비교 기준: PR은 base 브랜치, master push는 직전 커밋.
  BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && github.event.before || 'origin/master') }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    # 라벨 이벤트는 `full-gate`일 때만 게이트를 다시 돌린다(다른 라벨로 runner를 점유하지 않게).
    if: github.event.action != 'labeled' || github.event.label.name == 'full-gate'
    runs-on: [self-hosted, g1]
    outputs:
      n_minus_1: ${{ steps.decide.outputs.n_minus_1 }}
      repro_build: ${{ steps.decide.outputs.repro_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          FULL_GATE: ${{ contains(github.event.pull_request.labels.*.name, 'full-gate') }}
        run: |
          if [ "$EVENT" != "pull_request" ] || [ "$FULL_GATE" = "true" ]; then
            echo "n_minus_1=true" >> "$GITHUB_OUTPUT"
            echo "repro_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_REF"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qE '^services/core/migrations/|^services/core/src/.*db'; then
            echo "n_minus_1=true" >> "$GITHUB_OUTPUT"
          else
            echo "n_minus_1=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qE '(^|/)Dockerfile[^/]*$|^uv\.lock$|package-lock\.json$|^deploy/build/'; then
            echo "repro_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "repro_build=false" >> "$GITHUB_OUTPUT"
          fi

  lint-type:
    needs: plan
    runs-on: [self-hosted, g1]
    steps: &python-job
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: bash scripts/g1.sh "$GITHUB_JOB"

  import-linter:
    needs: plan
    runs-on: [self-hosted, g1]
    steps: *python-job

  unit:
    needs: plan
    runs-on: [self-hosted, g1]
    steps: *python-job

  contracts-diff:
    needs: plan
    runs-on: [self-hosted, g1]
    steps: *python-job

  migration-lint:
    needs: plan
    runs-on: [self-hosted, g1]
    steps: *python-job

  no-customer-branching:
    needs: plan
    runs-on: [self-hosted, g1]
    steps: *python-job

  contracts-drift:
    needs: plan
    runs-on: [self-hosted, g1]
    steps: &node-job
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bash scripts/g1.sh "$GITHUB_JOB"

  web:
    needs: plan
    runs-on: [self-hosted, g1]
    steps: *node-job

  # G1-8 V1 안 대리: 고객 repo와 같은 reusable workflow로 템플릿을 검증한다(g1.sh에는 없는 CI 전용 job,
  # 로컬 대응은 deploy/tests/test_project_template.py).
  template-validate:
    needs: plan
    uses: ./.github/workflows/validate-project.yml
    with:
      project_dir: deploy/templates/pureiron-project
      runs_on: '["self-hosted", "g1"]'

  template-outputs:
    needs: template-validate
    runs-on: [self-hosted, g1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - env:
          CONTENT_HASH: ${{ needs.template-validate.outputs.content_hash }}
          PROJECT_VERSION: ${{ needs.template-validate.outputs.project_version }}
        run: |
          if ! [[ "$CONTENT_HASH" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::content_hash 형식 오류: '$CONTENT_HASH'"
            exit 1
          fi
          local_hash="$(uv run --locked --package pureiron-project-tools pureiron-project hash deploy/templates/pureiron-project | tail -n 1)"
          if [ "$CONTENT_HASH" != "$local_hash" ]; then
            echo "::error::content_hash $CONTENT_HASH ≠ 로컬 hash $local_hash"
            exit 1
          fi
          # foundation-ci는 태그로 돌지 않는다 → project_version은 빈 값이어야 한다.
          if [ -n "$PROJECT_VERSION" ]; then
            echo "::error::태그가 아닌 실행에서 project_version='$PROJECT_VERSION'"
            exit 1
          fi
          echo "content_hash=$CONTENT_HASH (로컬 hash 일치), project_version=(없음)"

  integration-compose:
    needs: plan
    runs-on: [self-hosted, g1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: bash scripts/g1.sh integration-compose
      - if: failure()
        run: tail -n 200 artifacts/integration-compose.log || true

  web-e2e:
    needs: [plan, integration-compose]
    runs-on: [self-hosted, g1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --no-audit --no-fund && npx playwright install chromium
        working-directory: services/web
      - run: bash scripts/g1.sh web-e2e
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-e2e-${{ github.run_id }}
          path: artifacts/web-e2e/
          retention-days: 7

  # 중앙(M4-3 G8): deploy/central compose(control-db·control-api·Caddy)를 띄우고 Playwright로 basic auth·
  # /ui/fleet 토큰 주입 범위·online→stale 표시를 본다. 프로젝트 pureiron-it-central, HTTPS 127.0.0.1:28543
  # (리허설 central 25443·8100과 겹치지 않는다).
  control-web-e2e:
    needs: [plan, integration-compose]
    runs-on: [self-hosted, g1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --no-audit --no-fund && npx playwright install chromium
        working-directory: services/control-web
      - run: bash scripts/g1.sh control-web-e2e
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-web-e2e-${{ github.run_id }}
          path: artifacts/control-web-e2e/
          retention-days: 7

  n-minus-1:
    needs: plan
    if: needs.plan.outputs.n_minus_1 == 'true'
    runs-on: [self-hosted, g1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: bash scripts/g1.sh n-minus-1

  repro-build:
    needs: plan
    if: needs.plan.outputs.repro_build == 'true'
    runs-on: [self-hosted, g1]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: bash scripts/g1.sh repro-build
