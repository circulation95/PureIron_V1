# G2 nightly (M6-2): real Hyper-V VMs. Run only with this file so that the root pytest config
# (pyproject.toml) and G1 `unit` never collect these tests:
#   uv run pytest -c tests/e2e/gates/pytest.ini tests/e2e/gates -m g2 --junitxml <path>
# python_files + norecursedirs keep a path-less run from the repo root to tests/e2e/gates/test_g2_*.py
# (unit tests must not be named test_g2_*).
[pytest]
python_files = test_g2_*.py
testpaths = .
norecursedirs = .* services packages deploy docs projects scripts skills node_modules artifacts site m2d infra
markers =
    g2: G2 nightly scenario on real VMs (run by tests/e2e/gates/nightly.py)
    weekly: G2 weekly-only case (suite weekly runs -m g2, suite g2 runs -m "g2 and not weekly")
addopts = --strict-markers -p no:cacheprovider
junit_family = xunit1
