[project]
name = "pureiron-collector"
version = "0.1.0"
description = "현장 collector 서비스 — 장비 통신, 무상태, DB 무접근, core와 gRPC 스트림 하나"
requires-python = ">=3.12,<3.13"
dependencies = [
    "grpcio>=1.75",
    "protobuf>=6.32",
]

[project.scripts]
pureiron-collector = "pureiron_collector.main:main"

[build-system]
requires = ["uv_build==0.10.12"]
build-backend = "uv_build"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# generated ≠ authored (ADR-028, PD-20): 생성물(.py·.pyi)의 진단은 끄고, 타입은 .pyi(mypy-protobuf)를
# 정본으로 authored 코드에서 strict 소비한다. 생성 .pyi 자체의 진단은 생성기·types-protobuf 버전 조합 문제라 제외.
ignore = ["src/pureiron_collector/_gen/**"]
