[project]
name = "pureiron-control-api"
version = "0.1.0"
description = "중앙 control-api — 현장 등록·자격증명·heartbeat·DesiredState·보고·fleet 조회(ADR-022)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.118",
    "uvicorn>=0.37",
    "asyncpg>=0.30",
    # migrate 라이브러리(카탈로그·epoch envelope·적용·lint)와 DB 풀을 core와 같은 코드로 쓴다(M4 C6).
    "pureiron-core",
    # 현장 서명 봉투(sitesign)·.pib 메타데이터 읽기(P3: 현장과 같은 검증 코드).
    "pureiron-bundle-tools",
]

[tool.uv.sources]
pureiron-core = { workspace = true }
pureiron-bundle-tools = { workspace = true }

[project.scripts]
pureiron-control = "pureiron_control.cli:main"

[build-system]
requires = ["uv_build==0.10.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pureiron_control"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# generated ≠ authored (ADR-028, PD-20): 생성물(.py·.pyi)의 진단은 끄고, 타입은 .pyi(mypy-protobuf)를
# 정본으로 authored 코드에서 strict 소비한다. 생성 .pyi 자체의 진단은 생성기·types-protobuf 버전 조합 문제라 제외.
ignore = ["src/pureiron_control/_gen/**"]
