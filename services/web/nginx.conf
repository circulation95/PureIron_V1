# pureiron/web: 정적 SPA + core API 프록시(8080).
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # 보안 헤더(plan M3c D15): 다른 사이트가 운영 화면을 frame에 넣지 못하게(clickjacking), MIME 추측 금지,
    # 다른 origin에 Referer를 보내지 않는다. `always` = 오류 응답(4xx·5xx)에도 붙인다.
    # 주의: nginx는 location 안에 add_header가 하나라도 있으면 server 수준 add_header를 상속하지 않는다 —
    # location에 add_header를 더하면 이 네 줄도 그 location에 함께 적는다.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://core:8000;
        proxy_http_version 1.1;
        # 브라우저의 Host(포트 포함)를 그대로: core WS가 Origin과 대조한다(4403).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket(/api/v1/ws, M3b)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
