# schema epoch → 그 epoch의 마지막 마이그레이션 파일(ADR-024, plan §6.6).
# 마이그레이션을 포함한 release만 epoch를 +1 한다. release 기록(deploy/releases/*.json
# schema.app_expected)에 있는 epoch 항목은 바꾸지 않고, 아직 release되지 않은 epoch는 마지막 파일을
# 뒤 파일로 늘리는 것만 허용한다(migrate lint --base-ref).
# 앱 envelope: app_expected = 가장 큰 epoch, app_max_compatible = app_expected + 1.
epochs:
  1: 0005_project_state.sql
  2: 0007_cagg_1h_policy.sql
  3: 0009_historian.sql
  4: 0012_alarms.sql
